<div class="rounded-xl border border-paper-200 bg-paper p-5 shadow-sm transition-shadow hover:shadow-md">
  <div class="flex flex-col gap-3">
    <div class="flex items-start justify-between gap-2">
      <a [href]="link().shortUrl" target="_blank" rel="noopener noreferrer"
         class="text-lg font-semibold text-primary-600 hover:text-primary-800 break-all">
        {{ link().shortUrl }}
      </a>
      <button (click)="copyShortUrl(link().shortUrl)"
              class="shrink-0 rounded-lg p-2 text-paper-400 hover:bg-paper-100 hover:text-paper-600 transition-colors"
              [attr.aria-label]="copiedSignal() === link().shortUrl ? 'Copiado' : 'Copiar link'">
        @if (copiedSignal() === link().shortUrl) {
          <svg class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        } @else {
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        }
      </button>
    </div>

    <p class="text-sm text-paper-500 break-all">{{ link().originalUrl }}</p>

    <div class="flex flex-wrap items-center gap-3 text-xs text-paper-400">
      <span>{{ link().clickCount }} clicks</span>
      <span>&middot;</span>
      <span>Creado {{ link().createdAt | date:'shortDate' }}</span>
      @if (link().expiresAt) {
        <span>&middot;</span>
        <span>Expira {{ link().expiresAt | date:'shortDate' }}</span>
      }
      @if (!link().isActive) {
        <span class="rounded-full bg-red-100 px-2 py-0.5 text-red-700">Inactivo</span>
      }
    </div>

    @if (showActions()) {
      <div class="flex gap-2 border-t border-paper-100 pt-3">
        <button (click)="edit.emit(link())"
                class="rounded-lg px-3 py-1.5 text-sm font-medium text-paper-600 hover:bg-paper-100 transition-colors">
          Editar
        </button>
        <button (click)="delete.emit(link())"
                class="rounded-lg px-3 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">
          Eliminar
        </button>
      </div>
    }
  </div>
</div>
