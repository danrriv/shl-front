<header class="sticky top-0 z-50 border-b-4 border-double border-paper-900 bg-paper/90 backdrop-blur-sm">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <a routerLink="/" class="group" aria-label="Inicio">
      <span class="font-title text-3xl leading-none tracking-wide text-paper-900">Ya voy</span>
      <span class="mt-0.5 block text-[10px] font-medium uppercase tracking-[0.25em] text-paper-500">Acortador de links</span>
    </a>

    <nav class="flex items-center gap-4" aria-label="Navegación principal">
      @if (isAuthenticated()) {
        @if (user(); as u) {
          <span class="hidden text-sm text-paper-600 sm:inline">{{ u.email }}</span>
        }
        <a routerLink="/dashboard" routerLinkActive="text-primary-600"
           class="rounded-lg px-3 py-2 text-sm font-medium text-paper-600 hover:bg-paper-100 hover:text-paper-900 transition-colors">
          Dashboard
        </a>
        <button (click)="logout()"
                class="rounded-lg px-3 py-2 text-sm font-medium text-paper-500 hover:bg-paper-100 hover:text-paper-700 transition-colors">
          Salir
        </button>
      } @else {
        <ui-button (click)="login()">
          Iniciar sesión
        </ui-button>
      }
    </nav>
  </div>
</header>
