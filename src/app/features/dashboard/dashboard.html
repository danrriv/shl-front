<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-paper-900">Mis Links</h1>
    <a routerLink="/links/new" class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700 transition-colors">
      Nuevo link
    </a>
  </div>

  @if (error()) {
    <div class="rounded-lg bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <div class="flex justify-center py-12">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-primary-200 border-t-primary-600" role="status">
        <span class="sr-only">Cargando...</span>
      </div>
    </div>
  } @else if (hasLinks()) {
    <div class="grid gap-4 sm:grid-cols-2">
      @for (link of links(); track link.id) {
        <app-link-card [link]="link" (edit)="editLink($event)" (delete)="deleteLink($event)" />
      }
    </div>

    @if (totalPages() > 1) {
      <div class="flex items-center justify-center gap-4 pt-4">
        <button (click)="prevPage()" [disabled]="page() === 0"
                class="rounded-lg px-4 py-2 text-sm font-medium text-paper-700 hover:bg-paper-100 disabled:opacity-40 transition-colors">
          Anterior
        </button>
        <span class="text-sm text-paper-500">{{ page() + 1 }} / {{ totalPages() }}</span>
        <button (click)="nextPage()" [disabled]="page() >= totalPages() - 1"
                class="rounded-lg px-4 py-2 text-sm font-medium text-paper-700 hover:bg-paper-100 disabled:opacity-40 transition-colors">
          Siguiente
        </button>
      </div>
    }
  } @else {
    <app-empty-state title="No tienes links aún" description="Crea tu primer link acortado para empezar." />
  }
</div>
