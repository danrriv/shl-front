<div class="mx-auto max-w-lg space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">Crear nuevo link</h1>

  <form (ngSubmit)="submit()" #form="ngForm" class="space-y-4">
    <div>
      <label for="url" class="block text-sm font-medium text-gray-700">URL original *</label>
      <input
        id="url"
        type="url"
        name="url"
        required
        [ngModel]="originalUrl()"
        (ngModelChange)="originalUrl.set($event)"
        placeholder="https://ejemplo.com/tu-link"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 placeholder:text-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
      />
    </div>

    <div>
      <label for="shortCode" class="block text-sm font-medium text-gray-700">Código personalizado</label>
      <input
        id="shortCode"
        type="text"
        name="shortCode"
        minlength="3"
        maxlength="10"
        pattern="^[a-zA-Z0-9_-]+$"
        [ngModel]="shortCode()"
        (ngModelChange)="shortCode.set($event)"
        placeholder="mi-link (opcional)"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 placeholder:text-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
      />
      <p class="mt-1 text-xs text-gray-400">3-10 caracteres. Solo letras, números, guiones y guiones bajos.</p>
    </div>

    <div>
      <label for="expiresAt" class="block text-sm font-medium text-gray-700">Fecha de expiración</label>
      <input
        id="expiresAt"
        type="datetime-local"
        name="expiresAt"
        [ngModel]="expiresAt()"
        (ngModelChange)="expiresAt.set($event)"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600" role="alert">{{ error() }}</p>
    }

    <div class="flex gap-3 pt-2">
      <button
        type="submit"
        [disabled]="loading() || !originalUrl()"
        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700 disabled:opacity-50 transition-colors"
      >
        @if (loading()) { Creando... } @else { Crear link }
      </button>
      <button
        type="button"
        routerLink="/dashboard"
        class="rounded-lg border border-gray-300 px-5 py-2.5 font-medium text-gray-700 hover:bg-gray-50 transition-colors"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
