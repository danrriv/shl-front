<div class="mx-auto max-w-lg space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">{{ title() }}</h1>

  @if (loadingData()) {
    <div class="flex justify-center py-12">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600" role="status">
        <span class="sr-only">Cargando...</span>
      </div>
    </div>
  } @else if (link()) {
    <form (ngSubmit)="submit()" #form="ngForm" class="space-y-4">
      <div>
        <label for="url" class="block text-sm font-medium text-gray-700">URL original *</label>
        <input
          id="url"
          type="url"
          name="url"
          required
          [ngModel]="originalUrl()"
          (ngModelChange)="originalUrl.set($event)"
          class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>

      <div>
        <label for="expiresAt" class="block text-sm font-medium text-gray-700">Fecha de expiración</label>
        <input
          id="expiresAt"
          type="datetime-local"
          name="expiresAt"
          [ngModel]="expiresAt()"
          (ngModelChange)="expiresAt.set($event)"
          class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>

      <div class="flex items-center gap-3">
        <input
          id="isActive"
          type="checkbox"
          name="isActive"
          [ngModel]="isActive()"
          (ngModelChange)="isActive.set($event)"
          class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
        />
        <label for="isActive" class="text-sm text-gray-700">Link activo</label>
      </div>

      @if (error()) {
        <p class="text-sm text-red-600" role="alert">{{ error() }}</p>
      }

      <div class="flex gap-3 pt-2">
        <button
          type="submit"
          [disabled]="loading() || !originalUrl()"
          class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700 disabled:opacity-50 transition-colors"
        >
          @if (loading()) { Guardando... } @else { Guardar cambios }
        </button>
        <button
          type="button"
          routerLink="/dashboard"
          class="rounded-lg border border-gray-300 px-5 py-2.5 font-medium text-gray-700 hover:bg-gray-50 transition-colors"
        >
          Cancelar
        </button>
      </div>
    </form>
  } @else {
    <p class="text-gray-500">Link no encontrado.</p>
    <a routerLink="/dashboard" class="text-sm text-indigo-600 hover:text-indigo-800">Volver al dashboard</a>
  }
</div>
